name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS 13+ (${{ matrix.arch }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package app
        run: ./scripts/release.sh

      - name: Verify app and archive
        run: |
          codesign --verify --deep --strict Caffeinate.app
          plutil -lint Caffeinate.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Caffeinate.app/Contents/Info.plist)" = "13.0"
          lipo -verify_arch "$ARCH" Caffeinate.app/Contents/MacOS/Caffeinate
          xcrun vtool -show-build Caffeinate.app/Contents/MacOS/Caffeinate | grep -E 'minos 13\.0(\.0)?$'
          unzip -t Caffeinate.app.zip

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: Caffeinate-macos-13-${{ matrix.arch }}
          path: Caffeinate.app.zip
          if-no-files-found: error
          retention-days: 14
